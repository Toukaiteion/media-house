events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;

    # 后端上游：开启连接复用，避免每次 range 请求都重新建 TCP 连接
    upstream mediahouse_backend {
        server 127.0.0.1:5000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name localhost;

        # Health check
        location /health {
            proxy_pass http://mediahouse_backend/health;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }

        # API proxy
        location /api/ {
            proxy_pass http://mediahouse_backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 复用上游连接（配合上面的 upstream keepalive）
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # 视频是长响应，关掉缓冲：否则 nginx 会先攒一批再下发，
            # 首字节变慢，大响应还可能落到临时文件
            proxy_buffering off;
            proxy_request_buffering off;

            # Timeouts for large file uploads
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # Large body size for uploads
            client_max_body_size 50M;
        }

        # Frontend static files
        location / {
            root /app/wwwroot;
            try_files $uri $uri/ /index.html;
        }
    }
}
